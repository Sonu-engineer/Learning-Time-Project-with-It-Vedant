<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Student Result</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="./style.css">
```

</head>

<body>

<div class="container py-5">

```
<div class="result-box mx-auto">

    <h1 class="text-center mb-4">Student Result</h1>

    <form id="resultForm">

        <!-- Student Details -->
        <div class="card mb-4">
            <div class="card-header">
                <h4 class="mb-0">Student Details</h4>
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label for="studentName" class="form-label">
                            Student Name
                        </label>
                        <input type="text"
                               class="form-control"
                               id="studentName"
                               placeholder="Enter student name"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label for="studentClass" class="form-label">
                            Student Class
                        </label>
                        <input type="text"
                               class="form-control"
                               id="studentClass"
                               placeholder="Enter class"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label for="studentRollno" class="form-label">
                            Roll No
                        </label>
                        <input type="number"
                               class="form-control"
                               id="studentRollno"
                               placeholder="Enter roll number"
                               required>
                    </div>

                </div>

            </div>
        </div>


        <!-- Marks -->
        <div class="card mb-4">

            <div class="card-header">
                <h4 class="mb-0">Subject Marks</h4>
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="hindi" class="form-label">
                            Hindi
                        </label>
                        <input type="number"
                               class="form-control"
                               id="hindi"
                               placeholder="Enter Hindi marks"
                               min="0"
                               max="100"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="english" class="form-label">
                            English
                        </label>
                        <input type="number"
                               class="form-control"
                               id="english"
                               placeholder="Enter English marks"
                               min="0"
                               max="100"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="math" class="form-label">
                            Math
                        </label>
                        <input type="number"
                               class="form-control"
                               id="math"
                               placeholder="Enter Math marks"
                               min="0"
                               max="100"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="computer" class="form-label">
                            Computer
                        </label>
                        <input type="number"
                               class="form-control"
                               id="computer"
                               placeholder="Enter Computer marks"
                               min="0"
                               max="100"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="art" class="form-label">
                            Art
                        </label>
                        <input type="number"
                               class="form-control"
                               id="art"
                               placeholder="Enter Art marks"
                               min="0"
                               max="100"
                               required>
                    </div>

                </div>

            </div>
        </div>


        <!-- Button -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg px-5" onclick="print()">
                See Result
            </button>
        </div>




        <button onclick="downloadPDF()" class="btn btn-success">
    Download Result PDF
</button>
    </form>


    <!-- Result -->
    <div id="result" class="card mt-4 result-card d-none">

        <div class="card-header text-center">
            <h3>Student Result</h3>
        </div>

        <div class="card-body">

            <div class="row text-center">

                <div class="col-md-4 mb-3">
                    <strong>Name</strong>
                    <p id="resultName"></p>
                </div>

                <div class="col-md-4 mb-3">
                    <strong>Class</strong>
                    <p id="resultClass"></p>
                </div>

                <div class="col-md-4 mb-3">
                    <strong>Roll No</strong>
                    <p id="resultRoll"></p>
                </div>

            </div>

            <hr>

            <div class="row text-center">

                <div class="col-md-4">
                    <strong>Total Marks</strong>
                    <p id="totalMarks"></p>
                </div>

                <div class="col-md-4">
                    <strong>Percentage</strong>
                    <p id="percentage"></p>
                </div>

                <div class="col-md-4">
                    <strong>Grade</strong>
                    <p id="grade"></p>
                </div>

            </div>

            <div class="text-center mt-3">
                <h4 id="status"></h4>
            </div>

        </div>

    </div>

</div>


</div>

<script src="./project.js"></script>

</body>
</html>
