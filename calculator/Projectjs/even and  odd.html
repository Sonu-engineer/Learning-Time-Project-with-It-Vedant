body {

p {

}

/* Input Box */
#numberInput {
    width: 300px;
    padding: 15px;
    margin-top: 25px;
    border: 2px solid #555;
    border-radius: 10px;
    font-size: 18px;
    outline: none;
    box-sizing: border-box;
}

/* Input Focus */
#numberInput:focus {
    border-color: #007bff;
    box-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
}

/* Button */
button {
    padding: 15px 30px;
    margin-left: 10px;
    border: none;
    border-radius: 10px;
    background-color: #007bff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

/* Button Hover */
button:hover {
    background-color: #0056b3;
    transform: scale(1.05);
}

/* Result Paragraph */
body > p:last-child {
    font-weight: bold;
}

/* Mobile Responsive */
@media (max-width: 600px) {

    h1 {
        font-size: 32px;
    }

    p {
        font-size: 16px;
    }

    #numberInput {
        width: 90%;
        margin-bottom: 15px;
    }

    button {
        margin-left: 0;
    }
}


    </style>

    <p>2. Divide the number by 2.</p>
    <p>3. If the remainder is 0, the number is even. If

function checkEvenOdd() {

    const number = document.getElementById('numberInput').value;

    if (number === "" || isNaN(number)) {

        let word = document.createElement("p");

        word.innerText = "Please enter a valid number.";

        word.style.color = "red";
        word.style.fontSize="50px";

        document.body.appendChild(word);

        

        return;
    }

  
    const result = (number % 2 === 0) ? "even" : "odd";

    let word = document.createElement("p");

    if (result === "even") {
        word.innerText = "This is an even number.";
        word.style.color = "green";
         word.style.fontSize="50px";

    } else {
        word.innerText = "This is an odd number.";
        word.style.color = "red";
         word.style.fontSize="50px";

    }

    document.body.appendChild(word);

   
}
