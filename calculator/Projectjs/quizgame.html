<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Game</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        input[type="text"] {
            padding: 10px;
            margin: 10px 0;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #quiz-container {
            margin-top: 20px;
        }

        #score {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <!-- Start Screen -->

    <div id="start-screen">

        <h1>Welcome to the Quiz Game!</h1>

        <p>Test your knowledge with our fun quiz!</p>

        <input
            type="text"
            id="username"
            placeholder="Enter your name"
        >

        <br>

        <button onclick="startGame()">
            Start Quiz
        </button>

    </div>


    <!-- Quiz Screen -->

    <section id="quiz-screen" style="display: none;">

        <h1>Quiz Game</h1>

        <div id="question"></div>

        <input
            type="text"
            id="answer"
            placeholder="Your answer"
        >

        <br>

        <button onclick="submitAnswer()">
            Submit Answer
        </button>

        <div id="score"></div>

    </section>


    <script src="quizgame.js"></script>

</body>

</html>
